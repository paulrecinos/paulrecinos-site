<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Réinitialiser mon mot de passe — Longévité Sport</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #FF1B8D 0%, #FF6B9D 50%, #FFAB76 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 600;
      color: #E91E63;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 50px 14px 16px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="password"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #E91E63;
    }

    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 20px;
      width: auto;
      margin: 0;
      box-shadow: none;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .toggle-eye:hover {
      background: #f5f5f5;
      transform: translateY(-50%);
    }

    .password-hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .password-match {
      font-size: 12px;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }

    .password-match.match {
      color: #2e7d32;
      display: block;
    }

    .password-match.no-match {
      color: #c62828;
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: #E91E63;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      font-family: inherit;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: #C2185B;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    }

    button[type="submit"]:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .message {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .message.show {
      display: block;
    }

    .success-screen {
      text-align: center;
      padding: 20px 0;
      display: none;
    }

    .success-screen.show {
      display: block;
    }

    .success-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .success-screen h2 {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .success-screen p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .app-button {
      display: inline-block;
      background: #1a1a2e;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s;
    }

    .app-button:hover {
      background: #2a2a4e;
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }

    .footer a {
      color: #E91E63;
      text-decoration: none;
    }

    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- FORMULAIRE -->
    <div id="form-screen">
      <div class="logo">
        <div class="logo-text">🏋️ Longévité Sport</div>
      </div>

      <h1>Nouveau mot de passe</h1>
      <p class="subtitle">Choisis un nouveau mot de passe sécurisé pour ton compte.</p>

      <div id="message" class="message"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">Nouveau mot de passe</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="6"
              placeholder="Au moins 6 caractères"
              autocomplete="new-password"
            >
            <button type="button" class="toggle-eye" id="toggle-password" aria-label="Afficher le mot de passe">
              👁️
            </button>
          </div>
          <div class="password-hint">Minimum 6 caractères</div>
        </div>

        <div class="form-group">
          <label for="password-confirm">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password-confirm"
              name="password-confirm"
              required
              minlength="6"
              placeholder="Retape le même mot de passe"
              autocomplete="new-password"
            >
            <button type="button" class="toggle-eye" id="toggle-password-confirm" aria-label="Afficher le mot de passe">
              👁️
            </button>
          </div>
          <div id="password-match" class="password-match"></div>
        </div>

        <button type="submit" id="submit-btn">Mettre à jour mon mot de passe</button>
      </form>
    </div>

    <!-- ÉCRAN DE SUCCÈS -->
    <div id="success-screen" class="success-screen">
      <div class="success-icon">✅</div>
      <h2>Mot de passe mis à jour !</h2>
      <p>Tu peux maintenant te reconnecter à l'application Longévité Sport avec ton nouveau mot de passe.</p>
      <a href="https://apps.apple.com/fr/app/longévité-sport/id6761455014" class="app-button">
        📱 Ouvrir l'app
      </a>
    </div>

    <div class="footer">
      Besoin d'aide ? <a href="mailto:coach@recinospaul.com">Contacte-nous</a>
    </div>

  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = 'https://vezssspidlrqnmkzlijb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlenNzc3BpZGxycW5ta3psaWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODQyMzksImV4cCI6MjA4OTg2MDIzOX0.VHhOEPbFTwcg6TxwNqkC7rtykpMB-t7hiWcJr43VsL';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    });

    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const formScreen = document.getElementById('form-screen');
    const successScreen = document.getElementById('success-screen');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('password-confirm');
    const passwordMatchEl = document.getElementById('password-match');

    // Affiche un message d'erreur ou de succès
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type + ' show';
    }

    function hideMessage() {
      messageEl.className = 'message';
    }

    // BOUTON ŒIL — Toggle visibilité des mots de passe
    function setupEyeToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);

      button.addEventListener('click', function() {
        if (input.type === 'password') {
          input.type = 'text';
          button.textContent = '🙈';
          button.setAttribute('aria-label', 'Masquer le mot de passe');
        } else {
          input.type = 'password';
          button.textContent = '👁️';
          button.setAttribute('aria-label', 'Afficher le mot de passe');
        }
      });
    }

    setupEyeToggle('password', 'toggle-password');
    setupEyeToggle('password-confirm', 'toggle-password-confirm');

    // VÉRIFICATION EN TEMPS RÉEL — Les mots de passe correspondent ?
    function checkPasswordMatch() {
      const pwd = passwordInput.value;
      const pwdConfirm = passwordConfirmInput.value;

      if (pwdConfirm.length === 0) {
        passwordMatchEl.className = 'password-match';
        passwordMatchEl.textContent = '';
        return;
      }

      if (pwd === pwdConfirm) {
        passwordMatchEl.className = 'password-match match';
        passwordMatchEl.textContent = '✅ Les mots de passe correspondent';
      } else {
        passwordMatchEl.className = 'password-match no-match';
        passwordMatchEl.textContent = '❌ Les mots de passe ne correspondent pas';
      }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    passwordConfirmInput.addEventListener('input', checkPasswordMatch);

    // GESTION DU TOKEN DE RÉCUPÉRATION
    // Supabase peut envoyer le token de 2 façons :
    // 1. Dans le hash : #access_token=xxx&refresh_token=xxx&type=recovery
    // 2. Dans les query params : ?token=xxx (nouveau format)
    async function handleRecoveryToken() {
      // Méthode 1 : Hash params (format standard Supabase)
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      const type = hashParams.get('type');

      if (type === 'recovery' && accessToken) {
        try {
          // ✅ FIX : On établit explicitement la session avec setSession()
          const { data, error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });

          if (error) {
            console.error('Erreur setSession:', error);
            showMessage('⚠️ Lien expiré ou invalide. Demande un nouveau lien depuis l\'application.', 'error');
            submitBtn.disabled = true;
            return false;
          }

          console.log('✅ Session établie avec succès');
          return true;
        } catch (err) {
          console.error('Exception setSession:', err);
          showMessage('⚠️ Erreur lors de la validation du lien. Demande un nouveau lien.', 'error');
          submitBtn.disabled = true;
          return false;
        }
      }

      // Méthode 2 : Query params (au cas où)
      const urlParams = new URLSearchParams(window.location.search);
      const queryToken = urlParams.get('token');
      const queryType = urlParams.get('type');

      if (queryType === 'recovery' && queryToken) {
        try {
          const { data, error } = await supabaseClient.auth.verifyOtp({
            token_hash: queryToken,
            type: 'recovery'
          });

          if (error) {
            console.error('Erreur verifyOtp:', error);
            showMessage('⚠️ Lien expiré ou invalide. Demande un nouveau lien depuis l\'application.', 'error');
            submitBtn.disabled = true;
            return false;
          }

          console.log('✅ Token vérifié avec succès');
          return true;
        } catch (err) {
          console.error('Exception verifyOtp:', err);
          showMessage('⚠️ Erreur lors de la validation du lien.', 'error');
          submitBtn.disabled = true;
          return false;
        }
      }

      // Aucun token trouvé
      showMessage('⚠️ Lien invalide. Demande un lien depuis l\'application.', 'error');
      submitBtn.disabled = true;
      return false;
    }

    // SOUMISSION DU FORMULAIRE
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMessage();

      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;

      // Vérifications côté client
      if (password.length < 6) {
        showMessage('Le mot de passe doit contenir au moins 6 caractères.', 'error');
        return;
      }

      if (password !== passwordConfirm) {
        showMessage('Les deux mots de passe ne correspondent pas.', 'error');
        return;
      }

      // Désactiver le bouton + affichage chargement
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loader"></span>Mise à jour en cours...';

      try {
        // Vérifier qu'on a bien une session active
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
          console.error('Pas de session active:', sessionError);
          showMessage('❌ Session expirée. Demande un nouveau lien depuis l\'application.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Mettre à jour mon mot de passe';
          return;
        }

        // Mettre à jour le mot de passe
        const { data, error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        // Succès → bascule sur l'écran de succès
        formScreen.style.display = 'none';
        successScreen.classList.add('show');

        // Déconnexion propre après succès
        await supabaseClient.auth.signOut();

      } catch (err) {
        console.error('Erreur:', err);
        let errorMsg = err.message || 'Impossible de mettre à jour le mot de passe.';

        // Messages d'erreur plus clairs en français
        if (errorMsg.includes('Auth session missing')) {
          errorMsg = 'Session expirée. Demande un nouveau lien depuis l\'application.';
        } else if (errorMsg.includes('same password')) {
          errorMsg = 'Le nouveau mot de passe doit être différent de l\'ancien.';
        } else if (errorMsg.includes('weak')) {
          errorMsg = 'Mot de passe trop faible. Utilise au moins 6 caractères avec des lettres et chiffres.';
        }

        showMessage('❌ ' + errorMsg, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Mettre à jour mon mot de passe';
      }
    });

    // AU CHARGEMENT — Vérifier le token et établir la session
    window.addEventListener('load', async function() {
      await handleRecoveryToken();
    });
  </script>

</body>
</html>
